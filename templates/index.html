<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CRUD Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>

<body>
    <div class="container mt-5">
        <div class="card text-center mb-4">
            <div class="card-body">
                <h2>Flask CRUD Web Application</h2>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <h3>Student List
                    <button class="btn btn-success float-end" data-bs-toggle="modal" data-bs-target="#mymodal">Add Student</button>
                </h3>

                {% if students %}
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Roll No</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in students %}
                        <tr>
                            <td>{{ student['rollno'] }}</td>
                            <td>{{ student['name'] }}</td>
                            <td>{{ student['email'] }}</td>
                            <td>{{ student['mobile'] }}</td>
                            <td>
                                <a href="#" class="btn btn-warning btn-xs edit-btn" 
                                   data-rollno="{{ student['rollno'] }}"
                                   data-name="{{ student['name'] }}"
                                   data-email="{{ student['email'] }}"
                                   data-mobile="{{ student['mobile'] }}"
                                   data-bs-toggle="modal" data-bs-target="#mymodal">Edit</a>
                                <a href="/deleteStudent/{{ student['rollno'] }}" 
                                   class="btn btn-danger btn-xs"
                                   onclick="return confirm('Are you sure you want to delete?')">Delete</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                {% else %}
                    <p>No students found</p>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit Student -->
    <div id="mymodal" class="modal fade" tabindex="-1" aria-labelledby="mymodalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h4 class="modal-title" id="mymodalLabel">Add Student</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="studentForm" action="/addStudent" method="POST">
                        <input type="hidden" name="original_rollno" id="original_rollno">
                        <div class="form-group mb-3">
                            <label>Roll No:</label>
                            <input type="text" class="form-control" name="rollno" id="rollno" required>
                        </div>
                        <div class="form-group mb-3">
                            <label>Name:</label>
                            <input type="text" class="form-control" name="name" id="name" required>
                        </div>
                        <div class="form-group mb-3">
                            <label>Email:</label>
                            <input type="email" class="form-control" name="email" id="email" required>
                        </div>
                        <div class="form-group mb-3">
                            <label>Mobile:</label>
                            <input type="text" class="form-control" name="mobile" id="mobile" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="saveButton">Save</button>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>

            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/jquery-3.7.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>

    <script>
    $(document).ready(function() {
        // Handle Edit Button click
        $('.edit-btn').click(function() {
            var rollno = $(this).data('rollno');
            var name = $(this).data('name');
            var email = $(this).data('email');
            var mobile = $(this).data('mobile');

            $('#original_rollno').val(rollno);
            $('#rollno').val(rollno);
            $('#name').val(name);
            $('#email').val(email);
            $('#mobile').val(mobile);

            $('#studentForm').attr('action', '/editStudent');
            $('#saveButton').text('Update');
            $('#mymodalLabel').text('Edit Student');
        });

        // Reset modal when closed
        $('#mymodal').on('hidden.bs.modal', function () {
            $('#studentForm')[0].reset();
            $('#studentForm').attr('action', '/addStudent');
            $('#original_rollno').val('');
            $('#saveButton').text('Save');
            $('#mymodalLabel').text('Add Student');
        });
    });
    </script>
</body>
</html>
